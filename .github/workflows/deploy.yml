name: Deploy para a VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/dingdong
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            chown -R www-data:www-data /var/www/dingdong
            systemctl restart dingdong
            sleep 2
            systemctl is-active --quiet dingdong && echo "OK: serviço ativo" || (journalctl -u dingdong -n 50 --no-pager; exit 1)

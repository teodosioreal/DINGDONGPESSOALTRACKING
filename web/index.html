<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DingDong — Painel</title>
    <script>
      // Aplica o tema escuro antes do React montar, pra não piscar claro→escuro.
      try {
        var tema = localStorage.getItem("dingdong_tema");
        var escuro = tema ? tema === "escuro" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (escuro) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
